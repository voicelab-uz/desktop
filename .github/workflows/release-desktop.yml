name: Release VoiceLab Desktop

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to promote (must match package.json)"
        required: true
        type: string

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate-release:
    name: Validate tag and provenance
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.contract.outputs.tag }}
      version: ${{ steps.contract.outputs.version }}
      source_sha: ${{ steps.contract.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate immutable release provenance
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          checkout_sha="$(git rev-parse HEAD)"
          node scripts/release-contract.js provenance \
            --tag "$RELEASE_TAG" \
            --event "$GITHUB_EVENT_NAME" \
            --event-sha "$GITHUB_SHA" \
            --tag-sha "$tag_sha" \
            --checkout-sha "$checkout_sha"

  test-gate:
    name: Tests, quality, and release contract
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build test runtime dependencies
        run: npm rebuild better-sqlite3

      - name: Run release workflow contract tests
        run: npm run test:release-contract

      - name: Run full test and quality gate
        env:
          ELECTRON_OVERRIDE_DIST_PATH: /tmp
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm run i18n:check
          npm run build:renderer

  build-macos:
    name: Build macOS ${{ matrix.arch }} privately
    needs: [validate-release, test-gate]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require and install Apple signing material
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            test -n "${!name:-}" || { echo "Missing required secret: $name"; exit 1; }
          done

          certificate_path="$RUNNER_TEMP/voicelab-developer-id.p12"
          api_key_path="$RUNNER_TEMP/voicelab-notary-key.p8"
          keychain_path="$RUNNER_TEMP/voicelab-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | tee "$RUNNER_TEMP/signing-identities.txt"
          grep -q "Developer ID Application" "$RUNNER_TEMP/signing-identities.txt"

          echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"
          echo "CSC_LINK=$certificate_path" >> "$GITHUB_ENV"

      - name: Compile native helpers
        run: |
          npm run compile:globe -- --arch ${{ matrix.arch }}
          npm run compile:fast-paste -- --arch ${{ matrix.arch }}
          npm run compile:media-remote -- --arch ${{ matrix.arch }}
          npm run compile:audio-tap -- --arch ${{ matrix.arch }}
          npm run compile:mic-listener
          npm run compile:text-monitor

      - name: Download bundled helpers and models
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/download-meeting-aec-helper.js --current --platform darwin --arch ${{ matrix.arch }}
          node scripts/download-whisper-vad-model.js

      - name: Create secret-free release environment
        run: |
          cat > .env <<'EOF'
          VITE_AUTH_URL=https://voicelab.uz
          VITE_AUTH_API_URL=https://api.voicelab.uz
          VITE_VOICELAB_API_URL=https://api.voicelab.uz
          OPENWHISPR_PROTOCOL=voicelab
          VITE_OPENWHISPR_PROTOCOL=voicelab
          EOF

      - name: Build signed and notarized package without publication
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run generate:preloads
          npm run build:renderer
          npx cross-env CSC_IDENTITY_AUTO_DISCOVERY=true \
            electron-builder --mac --${{ matrix.arch }} --publish never \
            -c.publish.channel=latest-${{ matrix.arch }} \
            -c.mac.forceCodeSigning=true

      - name: Verify architecture, signature, notarization, package, and updater metadata
        env:
          VOICELAB_SIGNATURE_VERIFIED: "1"
          VOICELAB_NOTARIZATION_VERIFIED: "1"
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find dist -type d -name 'VoiceLab.app' -print -quit)"
          test -n "$app_path"
          executable="$app_path/Contents/MacOS/VoiceLab"
          expected_macho_arch="${{ matrix.arch }}"
          if [[ "$expected_macho_arch" == "x64" ]]; then expected_macho_arch="x86_64"; fi
          lipo -archs "$executable" | tr ' ' '\n' | grep -Fx "$expected_macho_arch"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --display --verbose=4 "$app_path" 2>&1 | grep -E 'Authority=Developer ID Application|TeamIdentifier='
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

          for dmg in dist/*.dmg; do hdiutil verify "$dmg"; done
          node scripts/release-contract.js package \
            --platform macos \
            --arch "${{ matrix.arch }}" \
            --tag "${{ needs.validate-release.outputs.tag }}" \
            --source-sha "${{ needs.validate-release.outputs.source_sha }}" \
            --dist dist \
            --out release-output

      - name: Upload verified private artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-macos-${{ matrix.arch }}
          path: release-output/
          if-no-files-found: error
          retention-days: 3

      - name: Remove Apple signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/voicelab-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/voicelab-developer-id.p12" "$RUNNER_TEMP/voicelab-notary-key.p8"

  build-linux:
    name: Build Linux x64 privately
    needs: [validate-release, test-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux build dependencies
        run: |
          npm install @rollup/rollup-linux-x64-gnu lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu --no-save
          sudo apt-get update
          sudo apt-get install -y rpm libx11-dev libxtst-dev libatspi2.0-dev libglib2.0-dev libpipewire-0.3-dev pkg-config

      - name: Compile and download bundled helpers and models
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run compile:native
          node scripts/download-meeting-aec-helper.js --current --platform linux --arch x64
          node scripts/download-whisper-vad-model.js
          resources/bin/linux-system-audio-helper probe | grep '"supportsNativeCapture":true'

      - name: Create secret-free release environment
        run: |
          cat > .env <<'EOF'
          VITE_AUTH_URL=https://voicelab.uz
          VITE_AUTH_API_URL=https://api.voicelab.uz
          VITE_VOICELAB_API_URL=https://api.voicelab.uz
          OPENWHISPR_PROTOCOL=voicelab
          VITE_OPENWHISPR_PROTOCOL=voicelab
          EOF

      - name: Build package without publication
        run: |
          npm run generate:preloads
          npm run build:linux -- --publish never

      - name: Verify package, preloads, secret scan, and updater metadata
        run: |
          node scripts/release-contract.js package \
            --platform linux \
            --arch x64 \
            --tag "${{ needs.validate-release.outputs.tag }}" \
            --source-sha "${{ needs.validate-release.outputs.source_sha }}" \
            --dist dist \
            --out release-output

      - name: Upload verified private artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-linux-x64
          path: release-output/
          if-no-files-found: error
          retention-days: 3

  build-windows:
    name: Build Windows x64 privately
    needs: [validate-release, test-gate]
    if: ${{ vars.ENABLE_WINDOWS_RELEASE == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require Windows signing material
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) { throw "Missing WINDOWS_CERTIFICATE_BASE64" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { throw "Missing WINDOWS_CERTIFICATE_PASSWORD" }
          $certificatePath = Join-Path $env:RUNNER_TEMP "voicelab-code-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          "WIN_CSC_LINK=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Windows native dependencies
        run: npm install @rollup/rollup-win32-x64-msvc lightningcss-win32-x64-msvc @tailwindcss/oxide-win32-x64-msvc --no-save

      - name: Download bundled helpers and models
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/download-meeting-aec-helper.js --current --platform win32 --arch x64
          node scripts/download-nircmd.js
          node scripts/download-windows-fast-paste.js
          node scripts/download-windows-key-listener.js
          node scripts/download-windows-mic-listener.js
          node scripts/download-windows-system-audio-helper.js
          node scripts/download-whisper-vad-model.js

      - name: Create secret-free release environment
        shell: pwsh
        run: |
          @(
            "VITE_AUTH_URL=https://voicelab.uz",
            "VITE_AUTH_API_URL=https://api.voicelab.uz",
            "VITE_VOICELAB_API_URL=https://api.voicelab.uz",
            "OPENWHISPR_PROTOCOL=voicelab",
            "VITE_OPENWHISPR_PROTOCOL=voicelab"
          ) | Set-Content -Path .env

      - name: Build signed package without publication
        env:
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          npm run generate:preloads
          npm run build:win -- --publish never -c.win.forceCodeSigning=true

      - name: Verify every executable signature and release contract
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Path dist -Filter "*.exe" | Where-Object { $_.Name -notmatch "uninstaller" }
          if ($installers.Count -lt 2) { throw "Both signed NSIS and portable Windows artifacts are required" }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid signature for $($installer.Name): $($signature.StatusMessage)"
            }
          }
          $env:VOICELAB_SIGNATURE_VERIFIED = "1"
          node scripts/release-contract.js package `
            --platform windows `
            --arch x64 `
            --tag "${{ needs.validate-release.outputs.tag }}" `
            --source-sha "${{ needs.validate-release.outputs.source_sha }}" `
            --dist dist `
            --out release-output

      - name: Upload verified private artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-windows-x64
          path: release-output/
          if-no-files-found: error
          retention-days: 3

      - name: Remove Windows signing material
        if: always()
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERTIFICATE_PATH) {
            Remove-Item -Force -ErrorAction SilentlyContinue $env:WINDOWS_CERTIFICATE_PATH
          }

  promote-release:
    name: Atomically promote verified release
    needs: [validate-release, test-gate, build-macos, build-linux, build-windows]
    if: >-
      ${{
        always() &&
        needs.validate-release.result == 'success' &&
        needs.test-gate.result == 'success' &&
        needs.build-macos.result == 'success' &&
        needs.build-linux.result == 'success' &&
        ((vars.ENABLE_WINDOWS_RELEASE == 'true' && needs.build-windows.result == 'success') ||
         (vars.ENABLE_WINDOWS_RELEASE != 'true' && needs.build-windows.result == 'skipped'))
      }}
    runs-on: ubuntu-latest
    environment: desktop-release-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-release.outputs.source_sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download all private verified artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: staged-release
          merge-multiple: true

      - name: Verify complete cross-architecture release set
        run: |
          node scripts/release-contract.js promote \
            --tag "${{ needs.validate-release.outputs.tag }}" \
            --source-sha "${{ needs.validate-release.outputs.source_sha }}" \
            --include-windows "${{ vars.ENABLE_WINDOWS_RELEASE == 'true' }}" \
            --dir staged-release

      - name: Publish one complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-release.outputs.tag }}
          VERSION: ${{ needs.validate-release.outputs.version }}
          WINDOWS_ENABLED: ${{ vars.ENABLE_WINDOWS_RELEASE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to mutate published assets"
            exit 1
          fi

          mapfile -t assets < <(find staged-release -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -gt 0
          gh release create "$TAG" "${assets[@]}" \
            --verify-tag \
            --title "VoiceLab Desktop $VERSION" \
            --notes-from-tag

          expected_count="${#assets[@]}"
          actual_count="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets | length')"
          test "$actual_count" -eq "$expected_count"
